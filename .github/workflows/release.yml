name: Publicar versão do Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar configuração do Supabase
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL)) {
            throw "O secret VITE_SUPABASE_URL não foi configurado no GitHub."
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_PUBLISHABLE_KEY)) {
            throw "O secret VITE_SUPABASE_PUBLISHABLE_KEY não foi configurado no GitHub."
          }
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Criar o instalador
        run: npm run make
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Publicar a Release
        shell: pwsh
        run: |
          $appVersion = (Get-Content package.json | ConvertFrom-Json).version
          gh release create $env:GITHUB_REF_NAME `
            "release/EditFlow-Setup-$appVersion.exe" `
            "release/EditFlow-Setup-$appVersion.exe.blockmap" `
            "release/latest.yml" `
            --verify-tag `
            --title "EditFlow $env:GITHUB_REF_NAME" `
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
